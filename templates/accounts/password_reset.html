



{% block content %}
<style>
.reset-password-card{
    max-width:550px;
    margin:40px auto;
    background:rgba(255,255,255,.95);
    border:none;
    border-radius:24px;
    box-shadow:0 20px 40px rgba(146,111,74,.15);
}

.reset-password-card .card-body{
    padding:40px;
}

.reset-password-card h3{
    text-align:center;
    color:#5a3d2b;
    font-weight:700;
    margin-bottom:15px;
}

.reset-password-card h3::after{
    content:"";
    display:block;
    width:60px;
    height:4px;
    background:#d8a86d;
    margin:12px auto 0;
    border-radius:20px;
}

.reset-password-card p{
    color:#6f5645;
    margin-bottom:20px;
}

.reset-password-card form p{
    margin-bottom:18px;
}

.reset-password-card label{
    display:block;
    color:#6f5645;
    font-weight:600;
    margin-bottom:8px;
}

.reset-password-card input{
    width:100%;
    padding:13px 16px;
    border:1px solid #ead8bc;
    border-radius:12px;
    background:#fffdf9;
    color:#5a3d2b;
    transition:.3s;
}

.reset-password-card input:focus{
    outline:none;
    border-color:#d8a86d;
    box-shadow:0 0 12px rgba(216,168,109,.25);
}

.reset-password-card .btn-primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#deb887,#d4a373);
    color:#fff;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.reset-password-card .btn-primary:hover{
    background:linear-gradient(135deg,#c7904d,#b7791f);
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(183,121,31,.25);
}

.reset-password-card .helptext{
    display:none;
}

.reset-password-card .errorlist{
    list-style:none;
    color:#dc2626;
    font-size:14px;
    padding:0;
    margin-bottom:10px;
}
</style>

<div class="reset-password-card">
    <div class="card-body">
        <h3>Reset Password</h3>

        <p class="text-center">
            Enter your email address below and we'll send you a link to reset your password.
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Send Reset Link
            </button>
        </form>
    </div>
</div>
{% endblock %}
