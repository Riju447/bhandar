

{% block content %}
<style>
.delete-card{
    max-width:550px;
    margin:40px auto;
    background:rgba(255,255,255,.95);
    border:none;
    border-radius:24px;
    box-shadow:0 20px 40px rgba(146,111,74,.15);
}

.delete-card .card-body{
    padding:40px;
    text-align:center;
}

.delete-card h3{
    color:#5a3d2b;
    font-size:32px;
    font-weight:700;
    margin-bottom:20px;
}

.delete-card h3::after{
    content:"";
    display:block;
    width:60px;
    height:4px;
    background:#d8a86d;
    margin:12px auto 0;
    border-radius:20px;
}

.delete-card p{
    color:#6f5645;
    font-size:16px;
    margin:25px 0;
}

.delete-card form{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.delete-card .btn-danger{
    padding:12px 24px;
    border:none;
    border-radius:12px;
    background:#dc3545;
    color:#fff;
    font-weight:600;
    transition:.3s;
}

.delete-card .btn-danger:hover{
    background:#bb2d3b;
    transform:translateY(-2px);
}

.delete-card .btn-secondary{
    padding:12px 24px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#deb887,#d4a373);
    color:#fff;
    font-weight:600;
    text-decoration:none;
    transition:.3s;
}

.delete-card .btn-secondary:hover{
    background:linear-gradient(135deg,#c7904d,#b7791f);
    color:#fff;
    transform:translateY(-2px);
}
</style>

<div class="delete-card">
    <div class="card-body">
        <h3>Delete User</h3>

        <p>
            Are you sure you want to delete
            <strong>{{ object.username }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Confirm Delete
            </button>

            <a href="{% url 'accounts:user_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
