

{% block content %}
<style>
.profile-card{
    max-width:600px;
    margin:40px auto;
    background:rgba(255,255,255,.95);
    border:none;
    border-radius:24px;
    box-shadow:0 20px 40px rgba(146,111,74,.15);
}

.profile-card .card-body{
    padding:40px;
}

.profile-card h3{
    text-align:center;
    color:#5a3d2b;
    font-size:32px;
    font-weight:700;
    margin-bottom:30px;
}

.profile-card h3::after{
    content:"";
    display:block;
    width:60px;
    height:4px;
    background:#d8a86d;
    margin:12px auto 0;
    border-radius:20px;
}

.profile-card form p{
    margin-bottom:18px;
}

.profile-card label{
    display:block;
    color:#6f5645;
    font-weight:600;
    margin-bottom:8px;
}

.profile-card input,
.profile-card textarea,
.profile-card select{
    width:100%;
    padding:13px 16px;
    border:1px solid #ead8bc;
    border-radius:12px;
    background:#fffdf9;
    color:#5a3d2b;
    font-size:15px;
    transition:.3s;
}

.profile-card input:focus,
.profile-card textarea:focus,
.profile-card select:focus{
    outline:none;
    border-color:#d8a86d;
    box-shadow:0 0 12px rgba(216,168,109,.25);
}

.profile-card textarea{
    resize:vertical;
}

.profile-card .btn-primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#deb887,#d4a373);
    color:#fff;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.profile-card .btn-primary:hover{
    background:linear-gradient(135deg,#c7904d,#b7791f);
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(183,121,31,.25);
}

.profile-card .helptext{
    display:none;
}

.profile-card .errorlist{
    list-style:none;
    color:#dc2626;
    font-size:14px;
    padding:0;
    margin-bottom:10px;
}

@media(max-width:768px){
    .profile-card .card-body{
        padding:30px 20px;
    }

    .profile-card h3{
        font-size:28px;
    }
}
</style>

<div class="profile-card">
    <div class="card-body">
        <h3>Profile</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
