

{% block content %}
<style>
.signup-card{
    max-width:600px;
    margin:40px auto;
    background:rgba(255,255,255,.95);
    border:none;
    border-radius:24px;
    box-shadow:0 20px 40px rgba(146,111,74,.15);
}

.signup-card .card-body{
    padding:40px;
}

.signup-card h3{
    text-align:center;
    color:#5a3d2b;
    font-size:32px;
    font-weight:700;
    margin-bottom:30px;
}

.signup-card h3::after{
    content:"";
    display:block;
    width:60px;
    height:4px;
    background:#d8a86d;
    margin:12px auto 0;
    border-radius:20px;
}

.signup-card form p{
    margin-bottom:18px;
}

.signup-card label{
    display:block;
    color:#6f5645;
    font-weight:600;
    margin-bottom:8px;
}

.signup-card input{
    width:100%;
    padding:13px 16px;
    border:1px solid #ead8bc;
    border-radius:12px;
    background:#fffdf9;
    color:#5a3d2b;
    font-size:15px;
    transition:.3s;
}

.signup-card input:focus{
    outline:none;
    border-color:#d8a86d;
    box-shadow:0 0 12px rgba(216,168,109,.25);
}

.signup-card .btn-primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#deb887,#d4a373);
    color:#fff;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.signup-card .btn-primary:hover{
    background:linear-gradient(135deg,#c7904d,#b7791f);
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(183,121,31,.25);
}

.signup-card .helptext{
    display:block;
    font-size:13px;
    color:#8b7355;
    margin-top:5px;
}

.signup-card .errorlist{
    list-style:none;
    color:#dc2626;
    font-size:14px;
    padding:0;
    margin-bottom:10px;
}

.signup-card .login-link{
    text-align:center;
    margin-top:25px;
    color:#7b6757;
}

.signup-card .login-link a{
    color:#b7791f;
    text-decoration:none;
    font-weight:600;
}

.signup-card .login-link a:hover{
    color:#8d5b22;
    text-decoration:underline;
}

@media(max-width:768px){
    .signup-card .card-body{
        padding:30px 20px;
    }

    .signup-card h3{
        font-size:28px;
    }
}
</style>

<div class="signup-card">
    <div class="card-body">
        <h3>Create an Account</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Sign Up
            </button>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'accounts:login' %}">Login</a>
        </div>
    </div>
</div>
{% endblock %}
