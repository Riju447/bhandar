


{% block content %}
<style>
.password-card{
    max-width:550px;
    margin:40px auto;
    background:rgba(255,255,255,.95);
    border:none;
    border-radius:24px;
    box-shadow:0 20px 40px rgba(146,111,74,.15);
}

.password-card .card-body{
    padding:40px;
}

.password-card h3{
    text-align:center;
    color:#5a3d2b;
    font-weight:700;
    margin-bottom:30px;
}

.password-card h3::after{
    content:"";
    display:block;
    width:60px;
    height:4px;
    background:#d8a86d;
    margin:12px auto 0;
    border-radius:20px;
}

.password-card form p{
    margin-bottom:18px;
}

.password-card label{
    display:block;
    font-weight:600;
    color:#6f5645;
    margin-bottom:8px;
}

.password-card input{
    width:100%;
    padding:13px 16px;
    border:1px solid #ead8bc;
    border-radius:12px;
    background:#fffdf9;
    color:#5a3d2b;
    transition:.3s;
}

.password-card input:focus{
    outline:none;
    border-color:#d8a86d;
    box-shadow:0 0 12px rgba(216,168,109,.25);
}

.password-card .btn-primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#deb887,#d4a373);
    color:#fff;
    font-weight:600;
    transition:.3s;
}

.password-card .btn-primary:hover{
    background:linear-gradient(135deg,#c7904d,#b7791f);
    transform:translateY(-2px);
}

.password-card .helptext{
    display:block;
    font-size:13px;
    color:#8b7355;
    margin-top:5px;
}

.password-card .errorlist{
    list-style:none;
    color:#dc2626;
    padding:0;
    margin-bottom:10px;
}
</style>

<div class="password-card">
    <div class="card-body">
        <h3>Change Password</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
