



{% block content %}
<style>
.sent-card{
    max-width:550px;
    margin:40px auto;
    background:rgba(255,255,255,.95);
    border:none;
    border-radius:24px;
    box-shadow:0 20px 40px rgba(146,111,74,.15);
}

.sent-card .card-body{
    padding:40px;
    text-align:center;
}

.sent-card h3{
    color:#5a3d2b;
    font-weight:700;
    margin-bottom:15px;
}

.sent-card h3::after{
    content:"";
    display:block;
    width:60px;
    height:4px;
    background:#d8a86d;
    margin:12px auto 0;
    border-radius:20px;
}

.sent-card p{
    color:#6f5645;
    font-size:16px;
    line-height:1.7;
    margin:25px 0;
}

.sent-btn{
    display:inline-block;
    padding:12px 28px;
    border-radius:12px;
    background:linear-gradient(135deg,#deb887,#d4a373);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.sent-btn:hover{
    background:linear-gradient(135deg,#c7904d,#b7791f);
    color:#fff;
}
</style>

<div class="sent-card">
    <div class="card-body">
        <h3>Password Reset Email Sent</h3>

        <p>
            We've emailed you a password reset link. Please check your inbox and
            follow the instructions to create a new password.
        </p>

        <a href="{% url 'accounts:login' %}" class="sent-btn">
            Back to Login
        </a>
    </div>
</div>
{% endblock %}
