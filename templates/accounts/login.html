

{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fefaf3,#f9eedb,#f4dfc1);
    overflow:hidden;
}

/* Decorative Background */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,221,170,.25);
    border-radius:50%;
    top:-180px;
    right:-120px;
    filter:blur(80px);
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(255,236,204,.4);
    border-radius:50%;
    bottom:-150px;
    left:-100px;
    filter:blur(80px);
}

.row{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.col-md-6{
    max-width:450px;
    width:100%;
    padding:20px;
}

.card{
    background:rgba(255,255,255,.90)!important;
    border:none!important;
    border-radius:25px!important;
    box-shadow:0 20px 40px rgba(146,111,74,.15);
    position:relative;
    z-index:10;
}

.card-body{
    padding:45px;
}

h3{
    text-align:center;
    color:#5a3d2b;
    font-size:34px;
    font-weight:700;
    margin-bottom:10px!important;
}

h3::after{
    content:"";
    display:block;
    width:60px;
    height:4px;
    background:#d8a86d;
    margin:12px auto 0;
    border-radius:20px;
}

form p{
    margin-bottom:18px;
}

form label{
    display:block;
    color:#6f5645;
    font-weight:600;
    margin-bottom:8px;
}

form input{
    width:100%;
    padding:13px 16px;
    border:1px solid #ead8bc;
    border-radius:12px;
    background:#fffdf9;
    color:#5a3d2b;
    font-size:15px;
    transition:.3s;
}

form input::placeholder{
    color:#bca48d;
}

form input:focus{
    outline:none;
    border-color:#d8a86d;
    box-shadow:0 0 12px rgba(216,168,109,.25);
}

.btn-primary{
    width:100%;
    padding:14px;
    border:none!important;
    border-radius:12px;
    background:linear-gradient(135deg,#deb887,#d4a373)!important;
    color:#fff!important;
    font-size:16px;
    font-weight:600;
    letter-spacing:.5px;
    transition:.3s;
}

.btn-primary:hover{
    background:linear-gradient(135deg,#c7904d,#b7791f)!important;
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(183,121,31,.25);
}

.mt-3{
    text-align:center;
    margin-top:25px!important;
    color:#7b6757;
}

.mt-3 a{
    color:#b7791f;
    text-decoration:none;
    font-weight:600;
}

.mt-3 a:hover{
    color:#8d5b22;
    text-decoration:underline;
}

.errorlist{
    list-style:none;
    color:#dc2626;
    font-size:14px;
    margin-bottom:10px;
    padding:0;
}

.helptext{
    display:none;
}

input:-webkit-autofill{
    -webkit-box-shadow:0 0 0 30px #fffdf9 inset !important;
    -webkit-text-fill-color:#5a3d2b !important;
}

@media(max-width:768px){

.card-body{
    padding:35px 25px;
}

h3{
    font-size:28px;
}

}</style>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4">Login</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p class="mt-3 mb-0">
                    Don't have an account? <a href="{% url 'accounts:signup' %}">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
