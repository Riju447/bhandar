{% extends 'base.html' %}
{% block title %}Record Purchase{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-3">Record a Purchase</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Save Purchase</button>
                    <a href="{% url 'purchases:purchase_list' %}" class="btn btn-outline-light ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
