{% extends 'base.html' %}
{% block title %}Brands{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Brands</h2>
    <a class="btn btn-primary" href="{% url 'brands:brand_create' %}">Add Brand</a>
</div>
<div class="card shadow-sm"><div class="card-body"><table class="table table-striped"><thead><tr><th>Name</th><th>Status</th><th></th></tr></thead><tbody>{% for brand in brands %}<tr><td>{{ brand.name }}</td><td>{% if brand.is_active %}Active{% else %}Inactive{% endif %}</td><td><a class="btn btn-sm btn-outline-secondary" href="{% url 'brands:brand_update' brand.pk %}">Edit</a><a class="btn btn-sm btn-outline-danger" href="{% url 'brands:brand_delete' brand.pk %}">Delete</a></td></tr>{% empty %}<tr><td colspan="3">No brands yet.</td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
